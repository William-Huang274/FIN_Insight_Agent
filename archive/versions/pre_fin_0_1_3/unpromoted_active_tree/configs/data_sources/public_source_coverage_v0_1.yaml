    data_available:
      - quarterly_financial_statement_bulk_data
      - labels_and_numeric_facts
    claim_scope: company_reported_financial_fact
    current_repo_status: materialized_bulk_zip_pending_parity_gate
    collector_status: implemented_bulk_zip_materialization
    parser_status: table_row_count_and_metadata_parser_only
    priority: P1_structured_financial_authority
    gap_type: none
    boundary_notes: "Official structured bulk path should be preferred for repeatable numeric extraction after parity gate; source filing citation remains required for investment claims."

