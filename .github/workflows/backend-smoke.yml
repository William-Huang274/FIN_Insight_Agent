name: current-baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engineering-and-product:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workbench/frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" "httpx>=0.27"

      - name: Verify active code and archive integrity
        run: |
          python scripts/engineering/verify_active_baseline.py --pretty
          python scripts/engineering/build_archive_redirect_index.py --check
          python scripts/engineering/check_repository_secrets.py

      - name: Compile and test current Python baseline
        run: |
          python -m compileall -q apps src scripts
          python -m pytest -q

      - name: Build and test the browser product
        working-directory: apps/workbench/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium-desktop

      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-workspace-playwright-failure
          path: apps/workbench/frontend/test-results
          if-no-files-found: ignore
