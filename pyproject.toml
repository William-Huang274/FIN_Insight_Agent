[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
build-constraint-dependencies = ["setuptools==84.0.0"]

[project]
name = "finsight-agent"
version = "0.1.3"
description = "Identity-bound reviewed financial research Workbench baseline."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "duckdb>=1.0.0",
  "fastapi>=0.115.0",
  "lxml>=6.1.1",
  "numpy>=1.26,<3",
  "playwright>=1.59.0",
  "pypdf>=6.7.0",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0.1",
  "rank-bm25>=0.2.2",
  "requests>=2.32.0",
  "scipy>=1.11,<2",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
control-plane = [
  "dagster==1.13.20",
  "dagster-postgres==0.29.20",
  "dagster-webserver==1.13.20",
  "filelock==3.32.4",
]
qualification = [
  "psycopg[binary]==3.3.4",
]
agent-runtime = [
  "langchain-core==1.6.1",
  "langchain-deepseek==1.1.0",
  "langchain-text-splitters==1.1.2",
  "langgraph==1.2.11",
  "langgraph-sdk==0.4.4",
  "langsmith==0.12.1",
  "mcp==2.1.1",
  "psycopg[binary,pool]==3.3.4",
  "sse-starlette==3.3.4",
]
complex-pdf = [
  "pdfplumber>=0.11.9",
  "pypdfium2>=5.7.1",
  "rapidocr-onnxruntime>=1.4.4",
]
external-search = [
  "ddgs==9.16.0",
  "trafilatura==2.2.0",
  "tencentcloud-sdk-python>=3.1.162",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  # Hermetic legacy/replay tests only. Dell product serving is Agent Server.
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "psutil>=5.9,<8",
  "pytest>=9.0.3,<10",
]
supply = [
  "cyclonedx-bom==7.3.1",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "setuptools==84.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sec_agent.agent_runtime" = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".codex_runtime", "node_modules", "dist"]
markers = [
  "contract_compile: mirror of the host-before-attempt contract compilation phase",
  "host_preflight: mirror of the clean synced host preflight phase",
  "disposable_current_gate: mirror of the Git-free disposable current gate phase",
  "historical_audit: mirror of the non-gating immutable historical audit phase",
  "post_run_attestation: mirror of the host read-only closeout attestation phase",
  "fast_contract: hermetic deterministic contract or unit test",
  "fixture_integration: integration test using temporary or repository fixtures without live external services",
  "local_data_integration: test whose result may depend on local non-hermetic data assets",
  "frontend_e2e: automated product or frontend journey test",
  "full_chain: broad or deterministic full-chain gate; explicit opt-in profile",
  "paid_model: test allowed to invoke a paid model; explicit opt-in and credential-gated",
  "requires_subprocess: test launches a local subprocess",
  "requires_java: test requires a local JDK/runtime",
  "requires_browser: test requires a browser or Playwright runtime",
  "requires_network: test requires outbound or local network access",
  "requires_local_data: test requires workstation-local data outside its temporary fixture",
]
