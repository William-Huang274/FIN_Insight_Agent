services:
  langgraph-redis:
    restart: ${FINSIGHT_SERVICE_RESTART_POLICY:-no}
    image: redis:6@sha256:143f7bfc2358911d6b36138eabfbfffea46273c5d4b5696d90e5cbf23d633cf8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 1s
      retries: 5

  langgraph-postgres:
    restart: ${FINSIGHT_SERVICE_RESTART_POLICY:-no}
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FINSIGHT_AGENT_SERVER_POSTGRES_PASSWORD:?set FINSIGHT_AGENT_SERVER_POSTGRES_PASSWORD in the repository .env}
      FINSIGHT_LANGGRAPH_POSTGRES_PASSWORD: ${FINSIGHT_LANGGRAPH_POSTGRES_PASSWORD:?set FINSIGHT_LANGGRAPH_POSTGRES_PASSWORD in the repository .env}
      FINSIGHT_FIN_RUNTIME_POSTGRES_PASSWORD: ${FINSIGHT_FIN_RUNTIME_POSTGRES_PASSWORD:?set FINSIGHT_FIN_RUNTIME_POSTGRES_PASSWORD in the repository .env}
      FINSIGHT_FIN_RUNTIME_OPERATOR_POSTGRES_PASSWORD: ${FINSIGHT_FIN_RUNTIME_OPERATOR_POSTGRES_PASSWORD:?set FINSIGHT_FIN_RUNTIME_OPERATOR_POSTGRES_PASSWORD in the repository .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=vector
    volumes:
      - langgraph-data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres-init/010-create-runtime-roles.sh
        target: /docker-entrypoint-initdb.d/010-create-runtime-roles.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres-init/025-install-fin-runtime-lifecycle-v1-1.sh
        target: /docker-entrypoint-initdb.d/025-install-fin-runtime-lifecycle-v1-1.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres-init/031-runtime-readiness-v1-1.sh
        target: /usr/local/bin/fin-postgres-runtime-readiness
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../src/sec_agent/agent_runtime/sql/001_agent_server_identity_v1_0.sql
        target: /opt/fin-insight/001_dell_agent_server_identity_v1_0.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../src/sec_agent/agent_runtime/sql/002_agent_server_remote_create_lifecycle_v1_1.sql
        target: /opt/fin-insight/002_dell_agent_server_remote_create_lifecycle_v1_1.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres-init/040-fin-runtime-schema-fingerprint.sql
        target: /opt/fin-insight/040-fin-runtime-schema-fingerprint.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/fin-postgres-runtime-readiness"]
      start_period: 10s
      timeout: 5s
      retries: 12
      interval: 5s
