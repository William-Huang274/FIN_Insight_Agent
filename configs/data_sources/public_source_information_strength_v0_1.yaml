    current_quality_contribution: high_for_us_issuer_fundamentals
    potential_quality_contribution: high
    allowed_research_use:
      - audited and unaudited SEC filing facts
      - SEC structured facts and filing metadata
      - issuer filing coverage and period identity
    forbidden_research_use:
      - market price or consensus claims
      - non-US filings not present in SEC
