schema_version: fin_agent_public_source_coverage_v0_1
as_of_date: "2026-06-10"
policy:
  commercial_api_spend: none
  credential_storage: env_only
  runtime_status: planning_contract_only
  promotion_rule: "A source can support production claims only after collector, parser, source-boundary audit, and gate coverage pass."

auth_status_definitions:
  no_key: "Public access without an API key, subject to published rate limits and terms."
  no_key_limited: "No-key access is possible but low-limit; key is recommended for batch or stable runs."
  free_key: "Free registration key or account required; key must be supplied via environment or private local config."
  open_bulk: "Official open bulk datasets or downloads rather than request/response APIs."
  official_web_no_key: "Official public web download with no stable API guarantee."
  official_portal_pending: "Official portal exists, but profile-specific query/download behavior still needs validation."
  endpoint_specific_pending: "Provider has public data, but target endpoint and parameter contract need validation."
  unofficial_provisional: "Unofficial or reverse-engineered access; staging/context only."
  commercial_deferred: "Commercial data or unstable free tier; deferred under the current no-paid-API policy."

gap_type_definitions:
  none: "No known source-level blocker; implementation may still be pending."
  auth_gap: "Free credential or account setup is required before implementation."
  parser_gap: "Download path exists but parser/normalizer is not accepted yet."
  endpoint_validation_gap: "Official endpoint or portal parameters need validation."
  identity_resolution_gap: "Entity/security mapping is required before downstream use."
  unofficial_provider_gap: "Provider is not official enough for authority claims."
  commercial_deferred: "Current policy blocks paid/commercial dependency."

sources:
  - source_id: sec_edgar_apis
    provider: SEC
    official_url: "https://www.sec.gov/search-filings/edgar-application-programming-interfaces"
    auth_status: no_key
    source_families:
      - sec_primary_filing
      - sec_companyfacts_structured_fact
      - sec_submissions_metadata
    data_available:
      - submissions_metadata
      - companyfacts_xbrl_json
      - frames_structured_facts
      - filing_metadata
    claim_scope: company_reported_financial_fact
    current_repo_status: implemented_partial
    collector_status: implemented_for_sec_primary_companyfacts_submissions
    parser_status: implemented_for_current_us_pipeline
    priority: P0_keep_core
    gap_type: none
    boundary_notes: "Authoritative for US issuer filings and SEC structured facts; not a market-data or consensus source."

  - source_id: sec_financial_statement_data_sets
    provider: SEC
    official_url: "https://www.sec.gov/dera/data/financial-statement-data-sets"
