name: java-research-intake
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/business-service/pom.xml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          version: '0.10.7'
      - name: Spring and PostgreSQL qualification
        working-directory: apps/business-service
        run: ./mvnw -B verify
      - name: Python intake and cross-language process recovery
        run: |
          uv sync --locked --extra agent-runtime --extra external-search --extra workbench-delivery --extra qualification
          uv run --no-sync python -m pytest -q tests/test_java_research_intake.py
          export FINSIGHT_INTAKE_TEST_JAR="$GITHUB_WORKSPACE/apps/business-service/target/business-service-0.1.0.jar"
          uv run --no-sync python -m pytest -q tests/integration/test_java_intake_stack.py
