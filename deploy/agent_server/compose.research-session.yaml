# Fresh research on the same Agent Server/PostgreSQL/Redis stack.
# Original source data may be mounted by compose.yaml; no old answer/report is required.
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.36.0/24

services:
  langgraph-api:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LANGSERVE_GRAPHS: '{"research_session": {"path": "sec_agent.agent_runtime.research_session_runtime:research_session_graph", "description": "Fresh source-bound research with native persistence and human review"}, "conversation_session": {"path": "sec_agent.agent_runtime.conversation_runtime:conversation_session_graph", "description": "General multi-turn assistant with scoped tools and native persistence"}, "dell_report_session": {"path": "sec_agent.agent_runtime.report_session:archived_report_session_graph", "description": "Read-only historical report checkpoints; execution retired"}}'
      FINSIGHT_RESEARCH_SESSION_ENABLED: ${FINSIGHT_RESEARCH_SESSION_ENABLED:-0}
      FINSIGHT_TASK_ATTACHMENTS_ROOT: /run/fin-insight/task-attachments
      FINSIGHT_TASK_VISION_ENABLED: ${FINSIGHT_TASK_VISION_ENABLED:-0}
      FINSIGHT_REPORT_SESSION_SETTINGS: /run/fin-insight/session-settings.json
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set the repository DeepSeek credential}
    volumes:
      - type: bind
        source: ${FINSIGHT_TASK_ATTACHMENTS_HOST_ROOT:?task-owned upload copies}
        target: /run/fin-insight/task-attachments
        bind: {create_host_path: false}
      - type: bind
        source: ${FINSIGHT_REPORT_SESSION_SETTINGS_HOST_PATH:?local runtime settings with audit_root}
        target: /run/fin-insight/session-settings.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FINSIGHT_REPORT_SESSION_CALLS_HOST_PATH:?private model audit directory}
        target: /run/fin-insight/session-calls
        bind: {create_host_path: false}
