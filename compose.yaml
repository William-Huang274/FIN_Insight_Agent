services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
      target: workbench
      args:
        REQUIREMENTS_FILE: requirements.txt
        WORKBENCH_IMAGE_KIND: current-product
        WORKBENCH_RUNTIME_PROFILE: reviewed-evidence
    image: finsight-workbench:compose
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      PYTHONUNBUFFERED: "1"
      WORKBENCH_IMAGE_KIND: current-product
      WORKBENCH_RUNTIME_PROFILE: reviewed-evidence
      WORKBENCH_SCRIPT_UPDATE_MODE: image_rebuild
      WORKBENCH_DATA_UPDATE_MODE: data_build_jobs
      FINSIGHT_DATA_ROOT: "/app/data"
      FINSIGHT_REVIEWED_EVIDENCE_ROOT: "/app/reviewed-evidence"
      FINSIGHT_WORKBENCH_PRIVATE_ROOT: "/app/state/workbench_private"
      FMP_API_KEY: "${FMP_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
    volumes:
      - ${WORKBENCH_CONFIGS_MOUNT:-./configs}:/app/configs:ro
      - ${WORKBENCH_DATA_MOUNT:-./data}:/app/data
      - ${WORKBENCH_REVIEWED_EVIDENCE_MOUNT:-./data/workbench_private}:/app/reviewed-evidence:ro
      - finsight-workbench-state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  finsight-workbench-state:
