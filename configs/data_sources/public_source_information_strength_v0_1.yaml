schema_version: fin_agent_public_source_information_strength_v0_1
as_of_date: "2026-06-11"
policy:
  commercial_api_spend: none
  purpose: no_commercial_public_source_research_ceiling
  runtime_default: planning_contract_only
  source_claim_rule: "Source strength defines what a row can prove; engineering readiness defines whether it can enter runtime."

information_strength_tiers:
  S5_primary_authority:
    score: 5
    label: primary company or regulatory disclosure authority
    can_support_company_facts: true
    typical_surfaces:
      - primary_evidence
      - exact_value_ledger
      - structured_fact_authority
    boundary: "Can support company-reported financial or operating facts only when the parser preserves period, unit, issuer, source document, and citation."
  S4_company_authored_operating_context:
    score: 4
    label: company-authored operating or product disclosure
    can_support_company_facts: true
    typical_surfaces:
      - company_operating_metric
      - earnings_material
      - official_product_status
    boundary: "Can support management commentary, product existence, and company-disclosed operating metrics; unaudited values need period and source caveats."
  S3_official_regulatory_product_context:
    score: 3
    label: official regulatory, product, ownership, or entity context
    can_support_company_facts: false
    typical_surfaces:
      - product_regulatory_context
      - legal_entity_identifier_registry
      - investment_graph_lagged
    boundary: "Can support official status, registration, identifier, or lagged filing facts; cannot prove company sales, adoption, profitability, or causal safety outcomes."
  S2_official_macro_industry_context:
    score: 2
    label: official macro, industry, trade, or public usage context
    can_support_company_facts: false
    typical_surfaces:
      - industry_snapshot
      - macro_context_inventory
      - public_usage_context
    boundary: "Can support macro/industry context and demand proxies; cannot be rewritten as company-level revenue, margin, customer, or product-sales facts."
  S1_resolver_or_lead:
    score: 1
    label: resolver, discovery, technology signal, or event lead
    can_support_company_facts: false
    typical_surfaces:
      - source_inventory
      - entity_resolution_candidate
      - external_event_lead
    boundary: "Can help find or join evidence; must be verified against S5/S4/S3 sources before becoming a research claim."
  S0_deferred_or_unofficial:
    score: 0
    label: deferred commercial, unofficial, or discovery-only source
    can_support_company_facts: false
    typical_surfaces:
      - deferred_source_gap
      - provisional_context
      - discovery_only
    boundary: "Cannot be treated as an authority source under the no-commercial-API policy."

integration_modes:
  primary_evidence_authority:
    runtime_surface: bounded_evidence
    feature_flag_required: true
    default_admissibility: claim_evidence_after_parser_gate
  structured_fact_authority:
    runtime_surface: exact_value_or_structured_fact
    feature_flag_required: true
    default_admissibility: claim_evidence_after_ledger_parity_gate
  company_operating_metric_parser:
    runtime_surface: company_product_operating_metric
    feature_flag_required: true
    default_admissibility: claim_evidence_after_metric_ontology_gate
  context_snapshot:
    runtime_surface: bounded_context_only
    feature_flag_required: true
    default_admissibility: context_only
  resolver_registry:
    runtime_surface: source_inventory_or_resolver
    feature_flag_required: true
    default_admissibility: not_claim_evidence
  lead_or_discovery:
    runtime_surface: gap_or_lead_queue
    feature_flag_required: true
    default_admissibility: lead_only_needs_verification
  held_for_parser_or_mapping:
    runtime_surface: gap_queue
    feature_flag_required: true
    default_admissibility: not_runtime_evidence
  deferred_no_commercial_api:
    runtime_surface: commercial_deferred_gap
    feature_flag_required: false
    default_admissibility: not_allowed_under_current_policy

research_quality_ceiling:
  overall_current_verified_ceiling: medium_high_for_us_filing_fundamentals_medium_for_context_low_for_consensus_and_private_supply_chain
  overall_potential_after_public_buildout: high_for_disclosed_company_facts_medium_high_for_context_and_regulatory_research_still_low_for_consensus_realtime_and_undisclosed_company_kpis
  dimensions:
    - dimension: us_company_fundamental_analysis
      current_ceiling: high
      potential_ceiling: high
      reason: SEC primary filings, CompanyFacts, submissions, and exact-value ledgers can support audited filing-based analysis.
      hard_limit: Cannot replace sell-side estimates, management access, or undisclosed product/customer metrics.
    - dimension: non_us_primary_disclosure_analysis
      current_ceiling: low_medium
      potential_ceiling: high
      reason: Official DART/EDINET/MOPS/HKEX/CNINFO/company IR sources are public, but document downloaders and parsers are not complete.
      hard_limit: Until parser gates pass, metadata and locators cannot be cited as filing evidence.
    - dimension: company_reported_product_operating_metrics
      current_ceiling: low_medium
      potential_ceiling: medium_high
      reason: Public company filings and earnings materials can support product revenue, deliveries, subscribers, backlog, or unit metrics when companies disclose them.
      hard_limit: No public source can infer undisclosed SKU-level sales, channel inventory, or product profitability.
    - dimension: macro_industry_context
      current_ceiling: medium
      potential_ceiling: medium_high
      reason: FRED, BLS, BEA, Census, EIA, FDIC, and trade datasets can provide official context and demand proxies.
      hard_limit: Context rows cannot prove company-specific revenue, margin, customers, or product adoption.
    - dimension: healthcare_product_regulatory_research
      current_ceiling: low_medium
      potential_ceiling: medium_high
      reason: ClinicalTrials.gov, openFDA, and CMS can support pipeline, regulatory, payer, and utilization context after product and sponsor resolvers.
      hard_limit: They do not prove approval success, commercial uptake, sales, or adverse-event causality.
    - dimension: auto_product_identity_and_context
      current_ceiling: low
      potential_ceiling: medium
      reason: NHTSA vPIC can identify make/model/year and product metadata after issuer mapping.
      hard_limit: It does not provide deliveries, revenue, margins, or quality causality.
    - dimension: banking_regulatory_context
      current_ceiling: low_medium
      potential_ceiling: medium
      reason: FDIC BankFind can provide institution and branch/regulatory context after institution-to-issuer mapping.
      hard_limit: FDIC institution rows are not consolidated listed-company financial statements.
    - dimension: investment_and_ownership_graph
      current_ceiling: low
      potential_ceiling: medium
      reason: SEC 13F and ownership forms are public and official but lagged.
      hard_limit: They cannot prove real-time positioning, intent, or non-filing private holdings.
    - dimension: supply_chain_and_customer_relationships
      current_ceiling: low_medium
      potential_ceiling: medium
      reason: SEC filings, verified relationship extraction, GLEIF, and official disclosures can support some relationship facts.
      hard_limit: Public sources cannot replace paid supply-chain transaction databases or customs microdata.
    - dimension: market_valuation_and_consensus
      current_ceiling: low_medium
      potential_ceiling: medium
      reason: Public/no-key data can provide prices, volumes, and some market context; identifier mapping is available.
      hard_limit: No reliable no-commercial source covers analyst consensus, target prices, or stable real-time valuation feeds.
    - dimension: event_and_news_research
      current_ceiling: low
      potential_ceiling: medium
      reason: Public event/news/discovery sources can surface leads.
      hard_limit: Leads must be verified against official/company/regulatory sources before entering claims.
    - dimension: technology_and_ip_signal
      current_ceiling: low
      potential_ceiling: medium
      reason: OpenAlex and patent data can show research and IP activity after endpoint validation.
      hard_limit: Signals cannot prove product launch, moat, sales, or profitability.

