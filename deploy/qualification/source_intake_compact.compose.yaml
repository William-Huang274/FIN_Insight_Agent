# Optional compact serial acceptance only; production/shared services unchanged.
services:
  postgres:
    mem_limit: 192m
    command: [postgres, -c, shared_buffers=16MB, -c, work_mem=1MB,
              -c, maintenance_work_mem=8MB, -c, max_connections=16,
              -c, max_parallel_workers=0, -c, jit=off]
