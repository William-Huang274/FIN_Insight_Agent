name: current-workbench-container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - compose.yaml
      - apps/workbench/**
      - configs/runtime/**
      - scripts/dev/**
      - src/**
      - .github/workflows/docker-smoke.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - compose.yaml
      - apps/workbench/**
      - configs/runtime/**
      - scripts/dev/**
      - src/**
      - .github/workflows/docker-smoke.yml

jobs:
  workbench-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose and build the only product image
        run: |
          docker compose config
          docker build \
            --target workbench \
            --build-arg REQUIREMENTS_FILE=requirements.txt \
            --build-arg WORKBENCH_IMAGE_KIND=current-product \
            --build-arg WORKBENCH_RUNTIME_PROFILE=reviewed-evidence \
            -t finsight-workbench:ci \
            .

      - name: Start container
        run: |
          docker run --rm -d \
            --name finsight-workbench-ci \
            -p 127.0.0.1:8765:8765 \
            finsight-workbench:ci

      - name: Verify health, product API and browser shell
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS \
            -H 'X-Fin-Product-Mode: current' \
            -H 'X-Fin-Case-Permissions: current_product:read' \
            http://127.0.0.1:8765/api/v1/research-cases \
            | python -c 'import json,sys; value=json.load(sys.stdin); assert [row["case_key"] for row in value["items"]] == ["DELL","MU","NVDA"]; assert value["evidence_objects_ready"] is False'
          readiness_status="$(curl -sS -o /tmp/finsight-readiness.json -w '%{http_code}' http://127.0.0.1:8765/api/readiness)"
          test "$readiness_status" = "503"
          python -c 'import json; value=json.load(open("/tmp/finsight-readiness.json", encoding="utf-8")); assert value["status"] == "data_mount_required"'
          curl -fsS http://127.0.0.1:8765/workspace | grep -q '<div id="root"></div>'

      - name: Show logs and stop container
        if: always()
        run: |
          docker logs finsight-workbench-ci || true
          docker stop finsight-workbench-ci || true
